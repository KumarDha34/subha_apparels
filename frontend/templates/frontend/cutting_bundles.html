{% extends "frontend/base.html" %}
{% block title %}Bundles - GMS{% endblock %}
{% block content %}
  <h2 class="page-title">Bundles</h2>
  <p class="page-subtitle">Group recorded cut pieces into bundles, ready to send to Production.</p>

  <div id="create-wrap"></div>
  <div id="bundles-wrap"></div>
  <div id="pieces-panel"></div>
{% endblock %}

{% block scripts %}
<script>
  Auth.guardPage(["CUTTING_SUPERVISOR"]);
  renderShell("cutting-bundles", "Bundles");

  let CUTTING_ORDERS = [];
  const createState = { cutting_order: "", combo: "", quantity: "" };
  const selected = new Set();   // bundle ids ticked for combining

  // ✅ combinable function — a bundle can be merged only while it is still on
  // the cutting floor: just CREATED and NOT yet sent to Production. Once it has
  // been sent/received/assigned to an operator, merging would break piece-rate
  // pay and traceability, so it's locked.
  const combinable = b => !b.sent_to_production_at && b.status === "CREATED";

  // Same cutting order + colour + size, 2 or more, all still combinable.
  function combinableGroups(bundles) {
    const groups = {};
    bundles.filter(combinable).forEach(b => {
      const k = `${b.cutting_order}:${b.color}:${b.size}`;
      (groups[k] = groups[k] || []).push(b);
    });
    return Object.values(groups).filter(g => g.length >= 2);
  }

  // Keep the two header buttons' labels + enabled state in sync with the ticks.
  function updateCombineButtons(groupCount) {
    const combineBtn = document.getElementById("combine-selected-btn");
    const mergeBtn = document.getElementById("merge-all-btn");
    if (combineBtn) {
      combineBtn.textContent = `🔗 Combine Selected (${selected.size})`;
      combineBtn.disabled = selected.size < 2;
    }
    if (mergeBtn && groupCount != null) {
      mergeBtn.textContent = groupCount ? `🧩 Merge All (${groupCount} group${groupCount === 1 ? "" : "s"})` : "🧩 Merge All";
      mergeBtn.disabled = groupCount === 0;
    }
  }

  /** Available-to-bundle quantity for one (color,size) combo */
  async function computeAvailability(cuttingOrder) {
    const [pieces, bundles, components] = await Promise.all([
      fetchAll(`/cutting/pieces/?cutting_order=${cuttingOrder.id}`),
      fetchAll(`/cutting/bundles/?cutting_order=${cuttingOrder.id}`),
      cuttingOrder.product ? fetchAll(`/master/product-components/?product=${cuttingOrder.product}&is_active=true`) : Promise.resolve([]),
    ]);
    const bySizeColor = new Map();
    const pieceKey = (p) => `${p.color}:${p.size}`;
    const alreadyBundled = (color, size) => bundles.filter(b => b.color === color && b.size === size).reduce((s, b) => s + b.quantity, 0);

    const combos = new Set(pieces.map(pieceKey));
    combos.forEach(key => {
      const [color, size] = key.split(":").map(Number);
      const already = alreadyBundled(color, size);
      let available;
      if (components.length) {
        available = Math.min(...components.map(comp => {
          const p = pieces.find(pp => pp.color === color && pp.size === size && pp.component === comp.id);
          return (p ? p.quantity : 0) - already;
        }));
      } else {
        const p = pieces.find(pp => pp.color === color && pp.size === size && pp.component == null);
        available = (p ? p.quantity : 0) - already;
      }
      const sample = pieces.find(pp => pp.color === color && pp.size === size);
      const label = sample ? `${sample.color_name} / ${sample.size_name}` : `Color ${color} / Size ${size}`;
      bySizeColor.set(key, { color, size, label, available: Math.max(available, 0) });
    });
    return bySizeColor;
  }

  async function renderCreateForm() {
    const wrap = document.getElementById("create-wrap");
    wrap.innerHTML = "";
    const errorBox = el("div", { class: "error-msg", style: "display:none;" });

    const orderSelect = selectEl({ onchange: async e => { createState.cutting_order = e.target.value; createState.combo = ""; await renderCreateForm(); } },
      CUTTING_ORDERS.map(c => ({ value: c.id, label: `${c.cutting_number} — ${c.fabric_type_name}/${c.color_name}` })), createState.cutting_order, "Select cutting order");

    let comboField = null, availabilityHint = null;
    const cuttingOrder = CUTTING_ORDERS.find(c => String(c.id) === String(createState.cutting_order));
    if (cuttingOrder) {
      const availability = await computeAvailability(cuttingOrder);
      const options = [...availability.values()].map(a => ({ value: `${a.color}:${a.size}`, label: `${a.label} — available: ${a.available}` }));
      comboField = field("Color / Size", selectEl({ onchange: e => { createState.combo = e.target.value; renderCreateForm(); } }, options, createState.combo, "Select color/size"));
      const chosen = availability.get(createState.combo);
      if (chosen) availabilityHint = el("p", { class: "muted" }, `Available to bundle: ${chosen.available}`);
    }

    const qtyField = field("Quantity", numberInput(createState.quantity, v => createState.quantity = v, { min: "1", step: "1" }));
    const submitBtn = el("button", { type: "button", onclick: submitBundle }, "Create Bundle");

    wrap.appendChild(el("div", { class: "card" }, [
      el("h3", {}, "Create Bundle"),
      errorBox,
      el("div", { class: "form-inline" }, [field("Cutting Order", orderSelect), comboField, qtyField].filter(Boolean)),
      availabilityHint,
      el("div", { class: "form-inline", style: "margin-top:0.5rem;" }, [submitBtn]),
    ]));
    wrap._errorBox = errorBox;
  }

  async function submitBundle() {
    const errorBox = document.getElementById("create-wrap")._errorBox;
    errorBox.style.display = "none";
    if (!createState.cutting_order || !createState.combo || !createState.quantity) {
      errorBox.textContent = "Select a cutting order, color/size, and quantity."; errorBox.style.display = "block"; return;
    }
    const [color, size] = createState.combo.split(":").map(Number);
    try {
      await apiPost("/cutting/bundles/", { cutting_order: Number(createState.cutting_order), color, size, quantity: Number(createState.quantity) });
      createState.quantity = "";
      await refreshBundles();
      await renderCreateForm();
    } catch (e) { errorBox.textContent = e.message; errorBox.style.display = "block"; }
  }

  async function sendToProduction(bundle) {
    try {
      await apiPost(`/cutting/bundles/${bundle.id}/send_to_production/`, {});
      await refreshBundles();
    } catch (e) { notify.error(e.message); }
  }

  // ✅ Combine selected bundles
  async function combineSelected() {
    const ids = [...selected];
    if (ids.length < 2) { 
      notify.warning("Tick at least two bundles — same colour & size — to combine."); 
      return; 
    }
    
    // Verify all selected bundles have same color and size
    const bundles = await fetchAll("/cutting/bundles/");
    const selectedBundles = bundles.filter(b => ids.includes(b.id));
    const colors = new Set(selectedBundles.map(b => b.color_name));
    const sizes = new Set(selectedBundles.map(b => b.size_name));
    
    if (colors.size > 1) {
      notify.warning("Selected bundles must have the SAME color.");
      return;
    }
    if (sizes.size > 1) {
      notify.warning("Selected bundles must have the SAME size.");
      return;
    }
    
    const ok = await showConfirm(
      `Combine ${ids.length} bundles (${selectedBundles[0]?.color_name}/${selectedBundles[0]?.size_name}) into one?`,
      { title: "Combine bundles", confirmText: "Combine" }
    );
    if (!ok) return;
    
    try {
      const merged = await apiPost("/cutting/bundles/combine/", { bundle_ids: ids });
      notify.success(`Combined into ${merged.bundle_number} — ${merged.quantity} pcs.`);
      selected.clear();
      await refreshBundles();
    } catch (e) { 
      notify.error(e.message); 
    }
  }

  // ✅ Merge ALL combinable bundles: group by cutting order + colour + size, merge each group of 2+.
  async function mergeAllCombinable() {
    const bundles = (await fetchAll("/cutting/bundles/")).filter(combinable);
    const groups = {};
    bundles.forEach(b => {
      const k = `${b.cutting_order}||${b.color_name}||${b.size_name}`;
      (groups[k] = groups[k] || []).push(b);
    });
    const mergeable = Object.values(groups).filter(g => g.length >= 2);
    if (!mergeable.length) { notify.warning("No groups of 2+ same colour & size bundles to merge."); return; }
    const ok = await showConfirm(
      `Merge all combinable bundles into ${mergeable.length} consolidated bundle(s)? Each colour/size group is summed into one.`,
      { title: "Merge All", confirmText: "Merge All" });
    if (!ok) return;
    let done = 0;
    for (const g of mergeable) {
      try { await apiPost("/cutting/bundles/combine/", { bundle_ids: g.map(b => b.id) }); done++; }
      catch (e) { notify.error(`${g[0].color_name}/${g[0].size_name}: ${e.message}`); }
    }
    notify.success(`Merged ${mergeable.length} group(s) into ${done} consolidated bundle(s).`);
    selected.clear();
    await refreshBundles();
  }

  // ✅ REFRESH BUNDLES - With manual table rendering
  async function refreshBundles() {
    const wrap = document.getElementById("bundles-wrap");
    wrap.innerHTML = "Loading...";
    try {
      const bundles = await fetchAll("/cutting/bundles/");
      
      // Drop ticks for bundles that no longer qualify
      [...selected].forEach(id => { 
        const b = bundles.find(x => x.id === id); 
        if (!b || !combinable(b)) selected.delete(id); 
      });
      
      wrap.innerHTML = "";
      const body = el("div", {});
      
      const groups = combinableGroups(bundles);

      // Create header with combine buttons (stable IDs so ticking a box updates
      // the right button and never clobbers "Merge All").
      const headerRow = el("div", { class: "crud-header" }, [
        el("h3", {}, "Bundles (grouped pieces, ready for Production)"),
        el("div", { class: "form-inline" }, [
          el("button", { id: "merge-all-btn", class: "secondary", type: "button", onclick: mergeAllCombinable }, "🧩 Merge All"),
          el("button", { id: "combine-selected-btn", class: "secondary", type: "button", onclick: combineSelected }, `🔗 Combine Selected (${selected.size})`),
        ]),
      ]);

      wrap.appendChild(el("div", { class: "card" }, [
        headerRow,
        el("p", { class: "muted", style: "margin:-0.3rem 0 0.6rem;" },
          "🕒 Merge only while a bundle is CREATED and not yet sent to Production. Tick two or more bundles of the same colour & size, then Combine — or use Merge All to consolidate every matching group at once."
        ),
        body,
      ]));
      
      // ✅ Build table manually with checkbox column
      const table = el("table", { class: "data-table" });
      
      // Header
      const thead = el("thead", {});
      const trHead = el("tr", {});
      const headers = ["", "Bundle #", "Cutting #", "Order", "Color", "Size", "Qty", "Status", "Sent to Production", ""];
      headers.forEach(h => {
        const th = el("th", {}, h);
        if (h === "") th.style.width = "30px";
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);
      table.appendChild(thead);
      
      // Body
      const tbody = el("tbody", {});
      bundles.forEach(b => {
        const tr = el("tr", {});
        
        // Checkbox column
        const td1 = el("td", { style: "text-align:center;width:30px;" });
        if (combinable(b)) {
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = selected.has(b.id);
          cb.onchange = function() {
            if (this.checked) selected.add(b.id);
            else selected.delete(b.id);
            updateCombineButtons();  // updates the Combine Selected button only
          };
          td1.appendChild(cb);
        } else {
          td1.appendChild(el("span", { class: "muted" }, "—"));
        }
        tr.appendChild(td1);
        
        // Bundle Number
        tr.appendChild(el("td", {}, b.bundle_number || "—"));
        
        // Cutting Number
        tr.appendChild(el("td", {}, b.cutting_number || "—"));
        
        // Order
        tr.appendChild(el("td", {}, b.order_number || "—"));
        
        // Color
        tr.appendChild(el("td", {}, b.color_name || "—"));
        
        // Size
        tr.appendChild(el("td", {}, b.size_name || "—"));
        
        // Quantity
        tr.appendChild(el("td", { style: "text-align:right;" }, String(b.quantity || 0)));
        
        // Status
        tr.appendChild(el("td", {}, badge(b.status || "—")));
        
        // Sent to Production
        const sentTd = el("td", {});
        if (b.sent_to_production_at) {
          sentTd.appendChild(el("span", {}, [
            badge("Sent"),
            " ",
            b.sent_to_production_at.slice(0, 16).replace("T", " ")
          ]));
        } else {
          sentTd.appendChild(badge("Not Sent"));
        }
        tr.appendChild(sentTd);
        
        // Actions
        const actionTd = el("td", {});
        if (!b.sent_to_production_at) {
          const sendBtn = el("button", { 
            type: "button", 
            onclick: () => sendToProduction(b) 
          }, "Send to Production");
          actionTd.appendChild(sendBtn);
        } else {
          actionTd.appendChild(el("span", { class: "muted" }, "—"));
        }
        tr.appendChild(actionTd);
        
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      body.appendChild(table);
      
      // Summary
      const total = bundles.length;
      const combinableCount = bundles.filter(b => combinable(b)).length;
      body.appendChild(el("p", { class: "muted", style: "margin-top:0.5rem;" },
        `${total} bundles · ${combinableCount} combinable (CREATED, not sent) · ${groups.length} mergeable group${groups.length === 1 ? "" : "s"}`
      ));

      // Set the two header buttons' labels + disabled states now that we know
      // how many mergeable groups exist.
      updateCombineButtons(groups.length);

    } catch (e) { 
      wrap.innerHTML = `<p class="error-msg">Could not load: ${e.message}</p>`; 
    }
  }

  // ==================== INIT ====================
  (async function init() {
    CUTTING_ORDERS = await fetchAll("/cutting/cutting-orders/?status=COMPLETED");
    await renderCreateForm();
    await refreshBundles();

    const allCuttingOrders = await fetchAll("/cutting/cutting-orders/");
    const cuttingOrderNumber = id => (allCuttingOrders.find(c => c.id === id) || {}).cutting_number || id;

    crudPanel(document.getElementById("pieces-panel"), {
      title: "Cutting Pieces (by color, size & component)",
      endpoint: "/cutting/pieces/",
      columns: [
        { render: p => cuttingOrderNumber(p.cutting_order), label: "Cutting Order" },
        { key: "color_name", label: "Color" },
        { key: "size_name", label: "Size" },
        { key: "component_name", label: "Component" },
        { key: "quantity", label: "Qty" },
      ],
      fields: [
        { name: "cutting_order", label: "Cutting Order", type: "select", optionsEndpoint: "/cutting/cutting-orders/", optionsLabel: "cutting_number", required: true },
        { name: "color", label: "Color", type: "select", optionsEndpoint: "/master/colors/", optionsLabel: "name", required: true },
        { name: "size", label: "Size", type: "select", optionsEndpoint: "/master/sizes/", optionsLabel: "name", required: true },
        { name: "component", label: "Component (optional)", type: "select", optionsEndpoint: "/master/product-components/", optionsLabel: "name" },
        { name: "quantity", label: "Quantity", type: "number", required: true },
      ],
    });
  })();
</script>
{% endblock %}
