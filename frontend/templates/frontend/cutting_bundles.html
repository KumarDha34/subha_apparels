{% extends "frontend/base.html" %}
{% block title %}Bundles - GMS{% endblock %}
{% block content %}
  <h2 class="page-title">Bundles</h2>
  <p class="page-subtitle">View and manage cut bundles — filter by product, select and combine bundles of the same color &amp; size.</p>

  <!-- Product Filter -->
  <div id="filter-wrap"></div>

  <!-- Bundles Display -->
  <div id="bundles-wrap"></div>

  <!-- Cutting Pieces Panel -->
  <div id="pieces-panel"></div>
{% endblock %}

{% block scripts %}
<script>
  Auth.guardPage(["CUTTING_SUPERVISOR"]);
  renderShell("cutting-bundles", "Bundles");

  // ==================== STATE ====================
  const selected = new Set();        // bundle ids ticked for combining
  let selectedProduct = "";          // current product filter
  let allBundles = [];              // cache all bundles
  let refreshTimer = null;           // auto-refresh timer

  // ==================== COMBINABLE LOGIC ====================
  const combinable = b => !b.sent_to_production_at && b.status === "CREATED";

  function combinableGroups(bundles) {
    const groups = {};
    bundles.filter(combinable).forEach(b => {
      const k = `${b.cutting_order}:${b.color}:${b.size}`;
      (groups[k] = groups[k] || []).push(b);
    });
    return Object.values(groups).filter(g => g.length >= 2);
  }

  function updateCombineButtons(groupCount) {
    const combineBtn = document.getElementById("combine-selected-btn");
    const mergeBtn = document.getElementById("merge-all-btn");
    if (combineBtn) {
      combineBtn.textContent = `🔗 Combine Selected (${selected.size})`;
      combineBtn.disabled = selected.size < 2;
    }
    if (mergeBtn && groupCount != null) {
      mergeBtn.textContent = groupCount ? `🧩 Merge All (${groupCount} group${groupCount === 1 ? "" : "s"})` : "🧩 Merge All";
      mergeBtn.disabled = groupCount === 0;
    }
  }

  // ==================== PRODUCT FILTER ====================
  function getProductOptions(bundles) {
    const products = new Map();
    bundles.forEach(b => {
      if (b.product && b.product_name) {
        const key = String(b.product);
        if (!products.has(key)) {
          products.set(key, {
            id: b.product,
            name: b.product_name,
            code: b.product_code || "",
            cutting_order: b.cutting_order
          });
        }
      }
    });
    return [...products.values()].sort((a, b) => a.name.localeCompare(b.name));
  }

  function populateProductFilter(bundles) {
    const wrap = document.getElementById("filter-wrap");
    if (!wrap) return;

    const options = getProductOptions(bundles);
    
    if (options.length === 0) {
      wrap.innerHTML = `
        <div class="card" style="padding:0.8rem 1.2rem;margin-bottom:1rem;background:var(--brand-soft);">
          <p class="muted" style="margin:0;font-size:0.9rem;">🔍 No bundles available yet. Create bundles from Cutting Orders.</p>
        </div>
      `;
      return;
    }

    // Build filter UI
    wrap.innerHTML = `
      <div class="card" style="padding:0.8rem 1.2rem;margin-bottom:1rem;">
        <div class="filter-container" style="display:flex;gap:1rem;flex-wrap:wrap;align-items:center;">
          <div style="min-width:280px;flex:1;">
            <label style="font-size:0.78rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:0.2rem;">🎯 Filter by Product</label>
            <select id="product-filter" style="width:100%;padding:0.5rem 0.7rem;border:1px solid var(--border-strong);border-radius:10px;font-size:0.86rem;background:var(--card-bg);">
              <option value="">📦 All Products</option>
            </select>
          </div>
          <div style="display:flex;align-items:flex-end;gap:0.5rem;flex-wrap:wrap;padding-bottom:0.1rem;">
            <button id="apply-filter-btn" class="secondary" type="button" onclick="applyProductFilter()">Apply Filter</button>
            <button id="clear-filter-btn" class="secondary" type="button" onclick="clearProductFilter()">Clear</button>
            <span id="filter-result" style="font-size:0.8rem;color:var(--text-muted);padding:0.3rem 0;min-width:150px;"></span>
          </div>
        </div>
      </div>
    `;

    const select = document.getElementById("product-filter");
    if (select) {
      options.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = `${p.code ? p.code + " — " : ""}${p.name}`;
        if (String(p.id) === String(selectedProduct)) {
          opt.selected = true;
        }
        select.appendChild(opt);
      });

      // Auto-apply filter when selection changes
      select.onchange = function() {
        applyProductFilter();
      };
    }
  }

  function applyProductFilter() {
    const select = document.getElementById("product-filter");
    if (select) {
      selectedProduct = select.value;
      refreshBundles();
    }
  }

  function clearProductFilter() {
    selectedProduct = "";
    const select = document.getElementById("product-filter");
    if (select) select.value = "";
    refreshBundles();
  }

  function filterBundlesByProduct(bundles) {
    if (!selectedProduct) return bundles;
    return bundles.filter(b => String(b.product) === String(selectedProduct));
  }

  function getProductName(productId) {
    const select = document.getElementById("product-filter");
    if (select) {
      const option = select.querySelector(`option[value="${productId}"]`);
      if (option) return option.textContent;
    }
    return "Selected Product";
  }

  // ==================== AUTO-REFRESH ====================
  function startAutoRefresh() {
    stopAutoRefresh();
    refreshTimer = setInterval(() => {
      refreshBundlesSilent();
    }, 30000); // refresh every 30 seconds
  }

  function stopAutoRefresh() {
    if (refreshTimer) {
      clearInterval(refreshTimer);
      refreshTimer = null;
    }
  }

  async function refreshBundlesSilent() {
    try {
      const bundles = await fetchAll("/cutting/bundles/");
      allBundles = bundles;
      
      // Only update if same product filter
      const filteredBundles = filterBundlesByProduct(bundles);
      
      // Update counts without full reload
      const resultSpan = document.getElementById("filter-result");
      if (resultSpan) {
        if (selectedProduct) {
          const productName = getProductName(selectedProduct);
          resultSpan.textContent = `🔄 ${filteredBundles.length} bundle(s) · ${new Date().toLocaleTimeString()}`;
        } else {
          resultSpan.textContent = `🔄 ${bundles.length} bundle(s) · ${new Date().toLocaleTimeString()}`;
        }
      }
    } catch (e) {
      // silent fail
    }
  }

  // ==================== BUNDLE ACTIONS ====================
  async function sendToProduction(bundle) {
    try {
      await apiPost(`/cutting/bundles/${bundle.id}/send_to_production/`, {});
      notify.success(`✅ Bundle ${bundle.bundle_number} sent to Production`);
      await refreshBundles();
    } catch (e) { notify.error(e.message); }
  }

  async function combineSelected() {
    const ids = [...selected];
    if (ids.length < 2) { 
      notify.warning("Tick at least two bundles — same colour & size — to combine."); 
      return; 
    }
    
    const bundles = await fetchAll("/cutting/bundles/");
    const selectedBundles = bundles.filter(b => ids.includes(b.id));
    const colors = new Set(selectedBundles.map(b => b.color_name));
    const sizes = new Set(selectedBundles.map(b => b.size_name));
    
    if (colors.size > 1) {
      notify.warning("Selected bundles must have the SAME color.");
      return;
    }
    if (sizes.size > 1) {
      notify.warning("Selected bundles must have the SAME size.");
      return;
    }
    
    const ok = await showConfirm(
      `Combine ${ids.length} bundles (${selectedBundles[0]?.color_name}/${selectedBundles[0]?.size_name}) into one?`,
      { title: "Combine bundles", confirmText: "Combine" }
    );
    if (!ok) return;
    
    try {
      const merged = await apiPost("/cutting/bundles/combine/", { bundle_ids: ids });
      notify.success(`✅ Combined into ${merged.bundle_number} — ${merged.quantity} pcs.`);
      selected.clear();
      await refreshBundles();
    } catch (e) { 
      notify.error(e.message); 
    }
  }

  async function mergeAllCombinable() {
    const filteredBundles = filterBundlesByProduct(allBundles);
    const bundles = filteredBundles.filter(combinable);
    const groups = {};
    bundles.forEach(b => {
      const k = `${b.cutting_order}||${b.color_name}||${b.size_name}`;
      (groups[k] = groups[k] || []).push(b);
    });
    const mergeable = Object.values(groups).filter(g => g.length >= 2);
    if (!mergeable.length) { 
      notify.warning(selectedProduct 
        ? `No groups of 2+ same colour & size bundles to merge for this product.` 
        : "No groups of 2+ same colour & size bundles to merge."); 
      return; 
    }
    const ok = await showConfirm(
      `Merge all combinable bundles into ${mergeable.length} consolidated bundle(s)? Each colour/size group is summed into one.`,
      { title: "Merge All", confirmText: "Merge All" });
    if (!ok) return;
    let done = 0;
    for (const g of mergeable) {
      try { await apiPost("/cutting/bundles/combine/", { bundle_ids: g.map(b => b.id) }); done++; }
      catch (e) { notify.error(`${g[0].color_name}/${g[0].size_name}: ${e.message}`); }
    }
    notify.success(`✅ Merged ${mergeable.length} group(s) into ${done} consolidated bundle(s).`);
    selected.clear();
    await refreshBundles();
  }

  // ==================== REFRESH BUNDLES ====================
  async function refreshBundles() {
    const wrap = document.getElementById("bundles-wrap");
    wrap.innerHTML = '<div class="muted" style="padding:2rem;text-align:center;">⏳ Loading bundles...</div>';
    
    try {
      const bundles = await fetchAll("/cutting/bundles/");
      allBundles = bundles;
      
      // Populate product filter
      populateProductFilter(bundles);
      
      // Filter by selected product
      const filteredBundles = filterBundlesByProduct(bundles);
      
      // Update filter result
      const resultSpan = document.getElementById("filter-result");
      if (resultSpan) {
        if (selectedProduct) {
          const productName = getProductName(selectedProduct);
          resultSpan.textContent = `📦 ${filteredBundles.length} bundle(s) · ${new Date().toLocaleTimeString()}`;
        } else {
          resultSpan.textContent = `📦 ${bundles.length} bundle(s) · ${new Date().toLocaleTimeString()}`;
        }
      }
      
      // Drop ticks for bundles that no longer qualify
      [...selected].forEach(id => { 
        const b = filteredBundles.find(x => x.id === id); 
        if (!b || !combinable(b)) selected.delete(id); 
      });
      
      wrap.innerHTML = "";
      
      if (filteredBundles.length === 0) {
        wrap.innerHTML = `
          <div class="card" style="padding:2rem;text-align:center;">
            <div style="font-size:2.5rem;margin-bottom:0.5rem;">📦</div>
            <p class="muted" style="font-size:1rem;margin:0;">
              ${selectedProduct ? `No bundles found for ${getProductName(selectedProduct)}` : "No bundles created yet"}
            </p>
            <p class="muted" style="font-size:0.85rem;margin-top:0.3rem;">
              Bundles are auto-created when you record a cut in Cutting Orders.
            </p>
          </div>
        `;
        return;
      }
      
      const body = el("div", {});
      const groups = combinableGroups(filteredBundles);

      // Create header with combine buttons
      const headerRow = el("div", { class: "crud-header" }, [
        el("h3", {}, selectedProduct 
          ? `📦 ${getProductName(selectedProduct)} (${filteredBundles.length} bundles)` 
          : `📦 All Bundles (${filteredBundles.length} bundles)`),
        el("div", { class: "form-inline", style: "gap:0.5rem;" }, [
          el("button", { id: "merge-all-btn", class: "secondary", type: "button", onclick: mergeAllCombinable }, 
            groups.length ? `🧩 Merge All (${groups.length})` : "🧩 Merge All"),
          el("button", { id: "combine-selected-btn", class: "secondary", type: "button", onclick: combineSelected }, 
            `🔗 Combine Selected (${selected.size})`),
        ]),
      ]);

      wrap.appendChild(el("div", { class: "card" }, [
        headerRow,
        el("p", { class: "muted", style: "margin:-0.3rem 0 0.6rem;font-size:0.82rem;" },
          selectedProduct
            ? `🔄 Showing bundles for ${getProductName(selectedProduct)}. Tick two or more bundles of the same colour & size to combine.`
            : "🔄 Merge only while a bundle is CREATED and not yet sent to Production. Tick two or more bundles of the same colour & size, then Combine."
        ),
        body,
      ]));
      
      // ✅ Build table with checkbox column
      const table = el("table", { class: "data-table" });
      
      // Header
      const thead = el("thead", {});
      const trHead = el("tr", {});
      const headers = ["", "Bundle #", "Cutting #", "Order", "Color", "Size", "Qty", "Status", "Sent", ""];
      headers.forEach(h => {
        const th = el("th", {}, h);
        if (h === "") th.style.width = "30px";
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);
      table.appendChild(thead);
      
      // Body
      const tbody = el("tbody", {});
      filteredBundles.forEach(b => {
        const tr = el("tr", {});
        
        // Checkbox column
        const td1 = el("td", { style: "text-align:center;width:30px;" });
        if (combinable(b)) {
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = selected.has(b.id);
          cb.onchange = function() {
            if (this.checked) selected.add(b.id);
            else selected.delete(b.id);
            updateCombineButtons(groups.length);
          };
          td1.appendChild(cb);
        } else {
          td1.appendChild(el("span", { class: "muted", style: "font-size:0.7rem;" }, "—"));
        }
        tr.appendChild(td1);
        
        // Bundle Number
        tr.appendChild(el("td", { style: "font-weight:600;" }, b.bundle_number || "—"));
        
        // Cutting Number
        tr.appendChild(el("td", {}, b.cutting_number || "—"));
        
        // Order
        tr.appendChild(el("td", {}, b.order_number || "—"));
        
        // Color
        tr.appendChild(el("td", {}, b.color_name || "—"));
        
        // Size
        tr.appendChild(el("td", {}, b.size_name || "—"));
        
        // Quantity
        tr.appendChild(el("td", { style: "text-align:right;font-weight:600;" }, String(b.quantity || 0)));
        
        // Status
        tr.appendChild(el("td", {}, badge(b.status || "—")));
        
        // Sent to Production
        const sentTd = el("td", {});
        if (b.sent_to_production_at) {
          sentTd.appendChild(el("span", { style: "font-size:0.75rem;color:var(--text-muted);" }, 
            new Date(b.sent_to_production_at).toLocaleDateString()
          ));
        } else {
          sentTd.appendChild(badge("Not Sent"));
        }
        tr.appendChild(sentTd);
        
        // Actions
        const actionTd = el("td", {});
        if (!b.sent_to_production_at) {
          const sendBtn = el("button", { 
            class: "success",
            type: "button", 
            style: "padding:0.25rem 0.7rem;font-size:0.75rem;",
            onclick: () => sendToProduction(b) 
          }, "📤 Send");
          actionTd.appendChild(sendBtn);
        } else {
          actionTd.appendChild(el("span", { class: "muted", style: "font-size:0.75rem;" }, "✅ Done"));
        }
        tr.appendChild(actionTd);
        
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      body.appendChild(table);
      
      // Summary
      const total = filteredBundles.length;
      const combinableCount = filteredBundles.filter(b => combinable(b)).length;
      body.appendChild(el("p", { class: "muted", style: "margin-top:0.5rem;font-size:0.8rem;" },
        `📊 ${total} bundles · ${combinableCount} combinable · ${groups.length} mergeable group${groups.length === 1 ? "" : "s"}`
      ));

      // Set button states
      updateCombineButtons(groups.length);

      // Start auto-refresh
      startAutoRefresh();

    } catch (e) { 
      wrap.innerHTML = `<p class="error-msg">❌ Could not load bundles: ${e.message}</p>`; 
    }
  }

  // ==================== INIT ====================
  (async function init() {
    await refreshBundles();

    // Clean up timer on page unload
    window.addEventListener("beforeunload", function() {
      stopAutoRefresh();
    });

    // Also show cutting pieces panel
    const allCuttingOrders = await fetchAll("/cutting/cutting-orders/");
    const cuttingOrderNumber = id => (allCuttingOrders.find(c => c.id === id) || {}).cutting_number || id;

    crudPanel(document.getElementById("pieces-panel"), {
      title: "📋 Cutting Pieces (by color, size & component)",
      endpoint: "/cutting/pieces/",
      columns: [
        { render: p => cuttingOrderNumber(p.cutting_order), label: "Cutting Order" },
        { key: "color_name", label: "Color" },
        { key: "size_name", label: "Size" },
        { key: "component_name", label: "Component" },
        { key: "quantity", label: "Qty" },
      ],
      fields: [
        { name: "cutting_order", label: "Cutting Order", type: "select", optionsEndpoint: "/cutting/cutting-orders/", optionsLabel: "cutting_number", required: true },
        { name: "color", label: "Color", type: "select", optionsEndpoint: "/master/colors/", optionsLabel: "name", required: true },
        { name: "size", label: "Size", type: "select", optionsEndpoint: "/master/sizes/", optionsLabel: "name", required: true },
        { name: "component", label: "Component (optional)", type: "select", optionsEndpoint: "/master/product-components/", optionsLabel: "name" },
        { name: "quantity", label: "Quantity", type: "number", required: true },
      ],
    });
  })();
</script>
{% endblock %}
