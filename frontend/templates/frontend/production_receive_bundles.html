{% extends "frontend/base.html" %}
{% block title %}Receive Bundles - GMS{% endblock %}
{% block content %}
  <h2 class="page-title">Receive Bundles</h2>
  <p class="page-subtitle">Confirm physical receipt of bundles cut and sent over by Cutting.</p>

  <div id="awaiting-wrap"></div>
  <div id="history-wrap"></div>
{% endblock %}

{% block scripts %}
<script>
  Auth.guardPage(["PRODUCTION_SUPERVISOR"]);
  renderShell("production-receive-bundles", "Receive Bundles");

  // Receive a single bundle
  async function receiveBundle(b) {
    try {
      await apiPost("/production/receipts/", { bundle: b.id });
      await refresh();
    } catch (e) { notify.error(e.message); }
  }

  // ✅ NEW: Receive ALL bundles at once
  async function receiveAllBundles(bundles) {
    const total = bundles.length;
    const ok = await showConfirm(`Receive all ${total} bundles? This will mark them as received in Production.`);
    if (!ok) return;

    let received = 0;
    let failed = 0;
    
    for (const b of bundles) {
      try {
        await apiPost("/production/receipts/", { bundle: b.id });
        received++;
      } catch (e) {
        failed++;
        console.error(`Failed to receive ${b.bundle_number}:`, e.message);
      }
    }

    if (failed === 0) {
      notify.success(`✅ All ${received} bundles received successfully!`);
    } else {
      notify.warning(`✅ ${received} bundles received, ${failed} failed. Check console for details.`);
    }
    await refresh();
  }

  async function refresh() {
    const awaitingWrap = document.getElementById("awaiting-wrap");
    const historyWrap = document.getElementById("history-wrap");
    awaitingWrap.innerHTML = "Loading...";
    historyWrap.innerHTML = "";
    
    try {
      // Fetch bundles waiting to be received (sent by Cutting, not yet received)
      const [awaiting, receipts] = await Promise.all([
        fetchAll("/cutting/bundles/?status=CREATED&sent_to_production_at__isnull=False"),
        fetchAll("/production/receipts/"),
      ]);

      awaitingWrap.innerHTML = "";
      
      // ✅ Header with "Receive All" button
      const headerEl = el("div", { class: "crud-header" }, [
        el("h3", {}, "Awaiting Receipt"),
        awaiting.length > 0 ? el("button", { 
          class: "success", 
          type: "button", 
          onclick: () => receiveAllBundles(awaiting) 
        }, `📦 Receive All ${awaiting.length} Bundles`) : null,
      ]);

      const awBody = el("div", {});
      awaitingWrap.appendChild(el("div", { class: "card" }, [headerEl, awBody]));

      if (!awaiting.length) {
        awBody.appendChild(el("p", { class: "muted" }, "No bundles awaiting receipt right now."));
      } else {
        dataTable(awBody, {
          columns: [
            { label: "Bundle #", key: "bundle_number" },
            { label: "Order", value: b => b.order_number || "", render: b => b.order_number || "—" },
            { label: "Cutting #", value: b => b.cutting_number || "", render: b => b.cutting_number || "—" },
            { label: "Color", key: "color_name" },
            { label: "Size", key: "size_name" },
            { label: "Qty", key: "quantity", value: b => Number(b.quantity) },
            { label: "Sent", value: b => b.sent_to_production_at || "", render: b => (b.sent_to_production_at ? new Date(b.sent_to_production_at).toLocaleDateString() : "—") },
            { label: "", sortable: false, render: b => el("button", { type: "button", onclick: () => receiveBundle(b) }, "Receive") },
          ], 
          rows: awaiting, 
          pageSize: 10, 
          searchPlaceholder: "Search bundles — number, order, color, size…",
        });
      }

      // Receipt History
      historyWrap.innerHTML = "";
      if (receipts.length) {
        const hBody = el("div", {});
        historyWrap.appendChild(el("div", { class: "card" }, [
          el("h3", {}, `Receipt History (${receipts.length})`), 
          hBody
        ]));
        dataTable(hBody, {
          columns: [
            { label: "Bundle #", key: "bundle_number" },
            { label: "Order", value: r => r.order_number || "", render: r => r.order_number || "—" },
            { label: "Cutting #", value: r => r.cutting_number || "", render: r => r.cutting_number || "—" },
            { label: "Color", value: r => r.color_name || "", render: r => r.color_name || "—" },
            { label: "Size", value: r => r.size_name || "", render: r => r.size_name || "—" },
            { label: "Qty", value: r => Number(r.quantity || 0), render: r => String(r.quantity ?? "—") },
            { label: "Received Date", key: "received_date", render: r => r.received_date ? new Date(r.received_date).toLocaleDateString() : "—" },
            { label: "Received By", value: r => r.received_by_name || "", render: r => r.received_by_name || "—" },
          ], 
          rows: receipts, 
          pageSize: 10, 
          initialSort: { key: "received_date", dir: "desc" }, 
          searchPlaceholder: "Search receipts — bundle, order, color…",
        });
      }
    } catch (e) { 
      awaitingWrap.innerHTML = `<p class="error-msg">Could not load: ${e.message}</p>`; 
    }
  }

  refresh();
</script>
{% endblock %}
