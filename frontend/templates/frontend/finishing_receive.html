{% extends "frontend/base.html" %}
{% block title %}Receive from Production - GMS{% endblock %}
{% block content %}
  <h2 class="page-title">Receive from Production</h2>
  <p class="page-subtitle">Pieces Production sent to Finishing. Confirm physical receipt — received orders move to Quality Check.</p>

  <div id="pending-wrap"></div>
  <div id="history-wrap"></div>
{% endblock %}

{% block scripts %}
<script>
  Auth.guardPage(["FINISHING_SUPERVISOR"]);
  renderShell("finishing-receive", "Receive from Production");

  const bd = obj => Object.entries(obj || {}).map(([k, v]) => `${k}: ${v}`).join(", ") || "—";

  async function receiveOne(pd) {
    try { await apiPost(`/production/process-dispatches/${pd.id}/receive/`, { quantity_received: pd.quantity_sent }); notify.success(`Received ${pd.order_number}.`); await load(); }
    catch (e) { notify.error(e.message); }
  }
  async function receiveAll(rows) {
    const ok = await showConfirm(`Receive all ${rows.length} order(s) from Production?`);
    if (!ok) return;
    let n = 0;
    for (const pd of rows) { try { await apiPost(`/production/process-dispatches/${pd.id}/receive/`, { quantity_received: pd.quantity_sent }); n++; } catch (e) { notify.error(`${pd.order_number}: ${e.message}`); } }
    notify.success(`Received ${n} order(s).`); await load();
  }

  async function load() {
    const [pending, history] = await Promise.all([
      fetchAll("/production/process-dispatches/?department=FINISHING&status=SENT").catch(() => []),
      fetchAll("/production/process-dispatches/?department=FINISHING&status=RECEIVED").catch(() => []),
    ]);

    // ---- Pending receipt ----
    const pw = document.getElementById("pending-wrap"); pw.innerHTML = "";
    const head = el("div", { class: "crud-header" }, [
      el("h3", {}, `⬇️ Pending Receipt (${pending.length})`),
      pending.length ? el("button", { type: "button", onclick: () => receiveAll(pending) }, "Receive All") : null,
    ]);
    const pbody = el("div", { style: "overflow-x:auto;" });
    pw.appendChild(el("div", { class: "card" }, [head, pbody]));
    if (!pending.length) {
      pbody.appendChild(el("p", { class: "muted" }, "Nothing waiting — Production hasn't sent any orders to Finishing yet."));
    } else {
      dataTable(pbody, {
        columns: [
          { key: "order_number", label: "Order #" },
          { key: "party_name", label: "Party", render: r => r.party_name || "—" },
          { label: "Qty Sent", value: r => Number(r.quantity_sent), render: r => String(r.quantity_sent) },
          { label: "Size Breakdown", sortable: false, render: r => bd(r.size_breakdown) },
          { label: "Colour Breakdown", sortable: false, render: r => bd(r.color_breakdown) },
          { key: "sent_date", label: "Sent", render: r => r.sent_date || "—" },
          { label: "Status", value: r => r.status, render: r => badge("PENDING RECEIPT") },
          { label: "Action", sortable: false, render: r => el("button", { class: "success", type: "button", onclick: () => receiveOne(r) }, "Receive") },
        ], rows: pending, pageSize: 12, searchPlaceholder: "Search — order, party…", emptyText: "Nothing pending.",
      });
    }

    // ---- Receipt history ----
    const hw = document.getElementById("history-wrap"); hw.innerHTML = "";
    const hbody = el("div", { style: "overflow-x:auto;" });
    hw.appendChild(el("div", { class: "card" }, [el("h3", {}, "🗂️ Receipt History"), hbody]));
    if (!history.length) {
      hbody.appendChild(el("p", { class: "muted" }, "No orders received yet."));
    } else {
      dataTable(hbody, {
        columns: [
          { key: "order_number", label: "Order #" },
          { key: "party_name", label: "Party", render: r => r.party_name || "—" },
          { label: "Quantity", value: r => Number(r.quantity_received ?? r.quantity_sent), render: r => String(r.quantity_received ?? r.quantity_sent) },
          { label: "Size Breakdown", sortable: false, render: r => bd(r.size_breakdown) },
          { label: "Colour Breakdown", sortable: false, render: r => bd(r.color_breakdown) },
          { key: "received_date", label: "Received", render: r => r.received_date || "—" },
        ], rows: history, pageSize: 10, initialSort: { key: "received_date", dir: "desc" },
        searchPlaceholder: "Search history — order, party…", emptyText: "No receipts yet.",
      });
    }
  }
  load();
</script>
{% endblock %}
